services:
  baiak-bot:
    build: .
    container_name: baiak-idle-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./bot.py:/app/bot.py
      - ./server.py:/app/server.py
      - ./stream.py:/app/stream.py
      - ./hunts.py:/app/hunts.py
      - ./hunt_sim.py:/app/hunt_sim.py
      - ./engine_hunts.json:/app/engine_hunts.json
      - ./chrome.py:/app/chrome.py
      - ./config.py:/app/config.py
      - ./extras.py:/app/extras.py
      - ./page_hud.js:/app/page_hud.js
      - ./page_hunt.js:/app/page_hunt.js
      - ./page_spell.js:/app/page_spell.js
      - ./page_potion.js:/app/page_potion.js
      - ./page_treino.js:/app/page_treino.js
      - ./page_boss.js:/app/page_boss.js
      - ./page_bags.js:/app/page_bags.js
      - ./page_equip.js:/app/page_equip.js
      - ./page_prey.js:/app/page_prey.js
      - ./page_extra.js:/app/page_extra.js
      - ./kernel_bot.js:/app/kernel_bot.js
      - ./baiakidle-helper.user.js:/app/baiakidle-helper.user.js
    shm_size: "256m"
    deploy:
      resources:
        limits:
          cpus: "0.80"
          memory: 768M
    environment:
      - PYTHONUNBUFFERED=1
      - SCREENSHOT_INTERVAL=0
      - LIVE_STREAM=false
      - STREAM_FPS=2
      - STREAM_WIDTH=854
      - STREAM_HEIGHT=480
      - STREAM_QUALITY=60
      - CHROME_GL=swiftshader
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=15).read()\""]
      interval: 45s
      timeout: 20s
      retries: 3
      start_period: 90s
