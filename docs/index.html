<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baiak Fleet Control</title>
<style>
:root{color-scheme:dark;--bg:#080a0e;--panel:#11151d;--panel2:#171d27;--line:#293344;--muted:#7f8b9d;--text:#f1f4f8;--cyan:#62d9ff;--lime:#a5ee75;--orange:#ffbb69;--red:#ff7185;--purple:#bba1ff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0a0d13 0%,#0b1119 55%,#101321 100%);color:var(--text);font:13px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}.shell{max-width:1600px;margin:auto;padding:22px 26px 42px}.top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:18px}.brand{display:flex;gap:13px;align-items:center}.mark{width:40px;height:40px;border:1px solid #3c89a2;border-radius:11px;display:grid;place-items:center;color:var(--cyan);font-weight:900;font-size:18px;background:#0e2630;box-shadow:0 0 28px #35c9ed22}.eyebrow{color:var(--cyan);font-size:10px;letter-spacing:.2em;text-transform:uppercase}.title{font-size:25px;font-weight:800;letter-spacing:-.045em;margin-top:1px}.subtitle{color:var(--muted);margin-top:3px}.clock{text-align:right;color:var(--muted);font-size:11px}.clock strong{display:block;color:var(--text);font-size:13px;margin-top:3px}.fleet-summary{display:grid;grid-template-columns:1.2fr repeat(4,1fr);gap:10px;margin-bottom:18px}.summary{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;min-height:77px}.summary.primary{background:linear-gradient(135deg,#12303b,#101923);border-color:#24647a}.summary .label{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}.summary strong{display:block;font-size:22px;line-height:1.2;margin-top:7px}.summary.primary strong{color:var(--cyan)}.summary small{color:var(--muted);display:block;margin-top:2px}.fleet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}..bot{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden}.bot.vps1{--bot:#62d9ff}.bot.vps2{--bot:#bba1ff}.bot-head{display:flex;justify-content:space-between;align-items:center;padding:15px 17px;background:linear-gradient(110deg,#151c27,#10151d);border-bottom:1px solid var(--line)}.bot-id{display:flex;align-items:center;gap:10px}.bot-number{color:var(--bot);font-size:18px;font-weight:900}.bot-host{font-size:12px;color:var(--muted)}.status{display:flex;align-items:center;gap:6px;border:1px solid #304050;padding:5px 9px;border-radius:99px;color:var(--muted);font-size:11px}.status i{width:7px;height:7px;border-radius:50%;background:var(--red)}.status.on{color:var(--lime);border-color:#456638}.status.on i{background:var(--lime);box-shadow:0 0 10px var(--lime)}.bot-body{padding:15px 17px}.hunt-line{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:14px}.hunt-label{color:var(--muted);font-size:10px;letter-spacing:.13em;text-transform:uppercase}.hunt-name{font-size:21px;font-weight:800;letter-spacing:-.03em;color:var(--bot);margin-top:3px}.decision{color:var(--orange);font-size:11px;text-align:right;max-width:45%}.metrics{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}.metric{padding:10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}.metric:nth-child(4n){border-right:0}.metric:nth-last-child(-n+4){border-bottom:0}.metric span,.rate span,.block-title{display:block;color:var(--muted);font-size:9px;letter-spacing:.1em;text-transform:uppercase}.metric b{display:block;font-size:17px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric.accent b{color:var(--bot)}.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:13px}.rate{background:#0d1219;border:1px solid #222c3a;border-radius:8px;padding:8px}.rate b{display:block;color:var(--bot);font-size:14px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lower{display:grid;grid-template-columns:1.05fr .95fr;gap:12px;margin-top:14px}.block{background:#0d1219;border:1px solid #222c3a;border-radius:10px;padding:11px}.block-title{margin-bottom:8px}.member{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #202936}.member:last-child{border-bottom:0}.member b{font-size:12px}.member small{display:block;color:var(--muted);font-size:10px}.ready{color:var(--lime)}.notready{color:var(--orange)}.subsystems{display:flex;flex-wrap:wrap;gap:5px}.subsystem{font-size:10px;color:var(--muted);border:1px solid #283344;border-radius:6px;padding:4px 6px}.subsystem b{color:var(--lime);font-weight:600}.subsystem.warn b{color:var(--orange)}.details{margin-top:11px}.details summary{cursor:pointer;color:var(--muted);font-size:11px}.details pre{white-space:pre-wrap;word-break:break-word;color:#aebbd0;font-size:10px;max-height:180px;overflow:auto}.wide{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px}.wide-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:11px}.wide-title{font-weight:750;font-size:16px}.wide-note{color:var(--muted);font-size:11px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{text-align:left;padding:9px;border-bottom:1px solid #242e3d}th{color:var(--muted);font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}td.num{text-align:right;color:var(--cyan)}.error{color:var(--red)}@media(max-width:1100px){.fleet-summary{grid-template-columns:repeat(3,1fr)}.summary.primary{grid-column:span 3}.fleet{grid-template-columns:1fr}}@media(max-width:650px){.shell{padding:15px 12px 30px}.top{display:block}.clock{text-align:left;margin-top:12px}.fleet-summary{grid-template-columns:repeat(2,1fr)}.summary.primary{grid-column:span 2}.metrics{grid-template-columns:repeat(2,1fr)}.metric:nth-child(2n){border-right:0}.metric:nth-last-child(-n+4){border-bottom:1px solid var(--line)}.metric:nth-last-child(-n+2){border-bottom:0}.rates{grid-template-columns:repeat(2,1fr)}.lower{grid-template-columns:1fr}.hunt-line{display:block}.decision{max-width:100%;text-align:left;margin-top:8px}}
</style></head>
<body><main class="shell">
<header class="top"><div class="brand"><div class="mark">BF</div><div><div class="eyebrow">Operations / Live Fleet</div><div class="title">Baiak Fleet Control</div><div class="subtitle">Duas VPS, uma leitura operacional. Sem screenshots, baixo tráfego.</div></div></div><div class="clock">ÚLTIMA SINCRONIZAÇÃO<strong id="updated">aguardando</strong><span>polling a cada 5 segundos</span></div></header>
<section class="fleet-summary" id="summary"></section><section class="fleet" id="fleet"></section><section class="wide"><div class="wide-head"><div class="wide-title">Benchmarks por hunt</div><div class="wide-note">Histórico consolidado das duas VPS</div></div><div id="benchmarks"></div></section>
</main><script>
const API='https://disfigure-tribune-silo.ngrok-free.dev',history={};const esc=v=>String(v??'—').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const num=v=>typeof v==='number'?v.toLocaleString('pt-BR',{maximumFractionDigits:1}):esc(v);
function pill(s){return`<span class="status ${s?.online?'on':''}"><i></i>${s?.online?'ONLINE':'OFFLINE'}</span>`}function subs(s){return`<div class="subsystems">${Object.entries(s.subsystems||{}).map(([k,v])=>`<span class="subsystem ${(v.status||'').includes('AGUARDANDO')?'warn':''}">${esc(k)} <b>${esc(v.status)}</b></span>`).join('')}</div>`}function party(s){const p=s.party_members||[];if(!p.length)return'<div class="empty">Party não disponível</div>';return p.map(m=>`<div class="member"><div><b>${esc(m.name||('Slot '+m.slot))}</b><small>${esc(m.voc||'')} · lvl ${esc(m.level||'—')}</small></div><small class="${m.ready?'ready':'notready'}">${m.ready?'READY':'NOT READY'}</small></div>`).join('')}
function card(id,b){const s=b.status||{},a=s.analyzer||{},an=s.analyzers||{},d=s.hunt_decision||{},m=s.hunt_matrix?.[s.last_hunt_id]||s.hunt_matrix?.[Object.keys(s.hunt_matrix||{})[0]]||{},level=Number(s.level)||0,rate=Number(s._levelRate)||0,damage=an.damage||{},taken=an.taken||{};return`<article class="bot ${id}"><div class="bot-head"><div class="bot-id"><div class="bot-number">${id.toUpperCase()}</div><div class="bot-host">${id==='vps1'?'Oracle / 168.138.151.18':'Oracle / 137.131.226.117'}</div></div>${pill(s)}</div><div class="bot-body"><div class="hunt-line"><div><div class="hunt-label">HUNT ATUAL</div><div class="hunt-name">${esc(s.hunt)}</div></div><div class="decision">${esc(d.reason||'Sem decisão registrada')}</div></div><div class="metrics"><div class="metric accent"><span>Nível atual</span><b>${num(level)}</b></div><div class="metric"><span>Gold</span><b>${num(s.gold)}</b></div><div class="metric"><span>Stamina</span><b>${esc(s.stamina)}</b></div><div class="metric"><span>Party</span><b>${num(s.party_slots)}</b></div><div class="metric"><span>Kills</span><b>${num(s.kills)}</b></div><div class="metric"><span>Waves</span><b>${num(s.waves)}</b></div><div class="metric"><span>Sessão</span><b>${num(s.elapsed_minutes)} min</b></div><div class="metric"><span>Loop</span><b>${s.loop_mode?'ON':'OFF'}</b></div></div><div class="rates"><div class="rate"><span>Level / hora</span><b>${num(rate)}</b></div><div class="rate"><span>XP / hora</span><b>${esc(an.xp_per_hour??m.xp_h_display??'—')}</b></div><div class="rate"><span>Loot / hora</span><b>${esc(an.loot_per_hour??m.loot_h_display??'—')}</b></div><div class="rate"><span>Gold / hora</span><b>${num(a.goldPerHour??m.avg_gold_h??0)}</b></div><div class="rate"><span>Kills / hora</span><b>${num(a.killsPerHour??m.avg_kills_h??0)}</b></div><div class="rate"><span>Waves / hora</span><b>${num(m.avg_waves_h??0)}</b></div><div class="rate"><span>Dano / segundo</span><b>${esc(Object.entries(damage).filter(([k])=>k!=='_raw').map(([k,v])=>k+': '+v).join(' · ')||'—')}</b></div><div class="rate"><span>Recebido / segundo</span><b>${esc(Object.entries(taken).filter(([k])=>k!=='_raw').map(([k,v])=>k+': '+v).join(' · ')||'—')}</b></div></div><div class="lower"><div class="block"><div class="block-title">PARTY / FORMAÇÃO</div>${party(s)}</div><div class="block"><div class="block-title">SUBSISTEMAS</div>${subs(s)}</div></div><details class="details"><summary>Estado técnico completo</summary><pre>${esc(JSON.stringify({last_update:s.last_update,treino:s.treino,magic:s.magic,analyzers:an,hunt_matrix:s.hunt_matrix},null,2))}</pre></details></div></article>`}
function summary(bots){const all=Object.values(bots).map(x=>x.status||{}),online=all.filter(x=>x.online).length,levels=all.map(x=>Number(x.level)||0),kills=all.reduce((n,x)=>n+(Number(x.kills)||0),0),gold=all.reduce((n,x)=>n+(Number(x.gold)||0),0);return`<div class="summary primary"><span class="label">Frota online</span><strong>${online} / ${all.length}</strong><small>monitoramento ativo</small></div><div class="summary"><span class="label">Nível máximo</span><strong>${num(Math.max(...levels,0))}</strong><small>entre os personagens</small></div><div class="summary"><span class="label">Kills totais</span><strong>${num(kills)}</strong><small>sessão combinada</small></div><div class="summary"><span class="label">Gold total</span><strong>${num(gold)}</strong><small>saldo observado</small></div><div class="summary"><span class="label">Última hunt</span><strong>${esc(all.find(x=>x.online)?.hunt||'—')}</strong><small>estado atual</small></div>`}
function bench(bots){const rows=[];for(const[id,b]of Object.entries(bots)){for(const[h,v]of Object.entries(b.benchmarks||{})){if(h.startsWith('_')||!v||typeof v!=='object')continue;rows.push(`<tr><td>${esc(id)}</td><td>${esc(v.name||h)}</td><td class="num">${num(v.gold_per_hour)}</td><td class="num">${num(v.kills_per_hour)}</td><td>${esc(v.deaths??0)}</td></tr>`)}}return`<table><thead><tr><th>Bot</th><th>Hunt</th><th>Gold/h</th><th>Kills/h</th><th>Deaths</th></tr></thead><tbody>${rows.length?rows.join(''):'<tr><td colspan="5">Sem benchmarks ainda</td></tr>'}</tbody></table>`}
function rates(d){const now=Date.now();for(const[id,b]of Object.entries(d.bots)){const l=Number(b.status?.level)||0,o=history[id];if(o&&l>0)b.status._levelRate=(l-o.level)/((now-o.time)/3600000);history[id]={level:l,time:now}}}
async function update(){try{const r=await fetch(API+'/api/overview',{cache:'no-store',headers:{'ngrok-skip-browser-warning':'true'}});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();rates(d);summary.innerHTML=summary(d.bots);fleet.innerHTML=Object.entries(d.bots).map(([id,b])=>card(id,b)).join('');benchmarks.innerHTML=bench(d.bots);updated.textContent=new Date(d.generatedAt).toLocaleTimeString('pt-BR')}catch(e){updated.textContent='erro: '+e.message;fleet.innerHTML='<p class="error">Falha ao carregar: '+esc(e.message)+'</p>'}}update();setInterval(update,5000);
</script></body></html>
