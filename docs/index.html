<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Baiak Fleet Monitor</title>
  <style>
    :root{color-scheme:dark;--bg:#080b12;--card:#111827;--line:#253047;--muted:#8793aa;--text:#edf2fa;--cyan:#55d6ff;--green:#5ee08a;--red:#ff7185;--amber:#f6c76b}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#17263c 0,#080b12 42%);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}.wrap{max-width:1700px;margin:auto;padding:26px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}h1,h2,h3,p{margin:0}h1{font-size:28px;letter-spacing:-.04em}h1 span{color:var(--cyan)}.sub{color:var(--muted);margin-top:5px}.refresh{color:var(--muted);text-align:right;font-size:12px}.fleet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:linear-gradient(145deg,rgba(20,29,46,.96),rgba(13,18,29,.96));border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 15px 45px #0003}.bot-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.bot-name{font-size:20px;font-weight:750}.pill{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:5px 10px;font-size:12px;background:#243047;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:var(--red)}.online .dot{background:var(--green);box-shadow:0 0 12px var(--green)}.online{color:var(--green)}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.metric{min-width:0;background:#0b111d;border:1px solid #1d2a40;border-radius:11px;padding:10px}.label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em}.value{margin-top:3px;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.accent{color:var(--cyan)}.rate-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.rate{padding:9px 10px;border-left:3px solid var(--cyan);background:#0b111d;border-radius:7px}.rate b{display:block;color:var(--cyan);font-size:16px;margin-top:2px}.split{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:15px}.section-title{color:#b8c5da;font-size:12px;text-transform:uppercase;letter-spacing:.09em;margin-bottom:8px}.party{display:grid;gap:7px}.member{display:flex;justify-content:space-between;align-items:center;background:#0b111d;border:1px solid #1d2a40;border-radius:9px;padding:8px 10px}.member small{color:var(--muted)}.bar{height:5px;background:#202d43;border-radius:5px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--green)}.empty{color:var(--muted);padding:10px 0}.subsystems{display:flex;flex-wrap:wrap;gap:6px}.subsys{border:1px solid #26344c;border-radius:8px;padding:5px 7px;font-size:11px;color:var(--muted)}.subsys b{color:var(--green)}.decision{color:var(--amber);min-height:44px}pre{white-space:pre-wrap;word-break:break-word;color:#aebbd0;font-size:11px;max-height:180px;overflow:auto;margin:0}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:8px;border-bottom:1px solid #202c40}th{color:var(--muted);font-weight:500}td.num{text-align:right;color:var(--cyan)}.error{color:var(--red)}.wide{margin-top:18px}@media(max-width:1200px){.metrics{grid-template-columns:repeat(4,1fr)}}@media(max-width:950px){.fleet{grid-template-columns:1fr}.metrics,.rate-grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.wrap{padding:14px}header{align-items:start;flex-direction:column}.refresh{text-align:left}}
  </style>
</head>
<body><main class="wrap">
  <header><div><h1>Baiak <span>Fleet Monitor</span></h1><p class="sub">Duas VPS, uma visão operacional. Sem screenshots. Atualização a cada 5 segundos.</p></div><div class="refresh">Última leitura<br><strong id="updated">aguardando</strong></div></header>
  <section class="fleet" id="fleet"></section>
  <section class="wide card"><div class="section-title">Benchmarks por hunt</div><div id="benchmarks"></div></section>
</main>
<script>
const API='https://disfigure-tribune-silo.ngrok-free.dev';const history={};
const esc=v=>String(v??'—').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const num=v=>typeof v==='number'?v.toLocaleString('pt-BR',{maximumFractionDigits:1}):esc(v);const pill=s=>`<span class="pill ${s&&s.online?'online':''}"><i class="dot"></i>${s&&s.online?'ONLINE':'OFFLINE'}</span>`;
function party(s){const p=s.party_members||[];if(!p.length)return'<div class="empty">Party não disponível</div>';return`<div class="party">${p.map(m=>`<div class="member"><div><b>${esc(m.name||('Slot '+m.slot))}</b><br><small>${esc(m.voc||'')} · lvl ${esc(m.level||'—')} · ${m.ready?'ready':'not ready'}</small></div><div style="width:100px"><small>HP ${esc(m.hpPct??'—')}%</small><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(m.hpPct)||0))}%"></i></div></div></div>`).join('')}</div>`}
function subs(s){return`<div class="subsystems">${Object.entries(s.subsystems||{}).map(([k,v])=>`<span class="subsys">${esc(k)} <b>${esc(v.status)}</b></span>`).join('')}</div>`}
function card(id,b){const s=b.status||{},a=s.analyzer||{},an=s.analyzers||{},d=s.hunt_decision||{},m=s.hunt_matrix?.[s.last_hunt_id]||s.hunt_matrix?.[Object.keys(s.hunt_matrix||{})[0]]||{},elapsed=Number(s.elapsed_minutes)||0,level=Number(s.level)||0,rate=Number(s._levelRate)||0,damage=an.damage||{},taken=an.taken||{};return`<article class="card"><div class="bot-head"><div><div class="bot-name">${id.toUpperCase()}</div><small class="sub">Atualizado: ${esc(s.last_update||'—')}</small></div>${pill(s)}</div><div class="metrics"><div class="metric"><div class="label">Hunt atual</div><div class="value accent">${esc(s.hunt)}</div></div><div class="metric"><div class="label">Nível atual</div><div class="value">${num(level)}</div></div><div class="metric"><div class="label">Gold atual</div><div class="value">${num(s.gold)}</div></div><div class="metric"><div class="label">Stamina</div><div class="value">${esc(s.stamina)}</div></div><div class="metric"><div class="label">Kills totais</div><div class="value">${num(s.kills)}</div></div><div class="metric"><div class="label">Waves totais</div><div class="value">${num(s.waves)}</div></div><div class="metric"><div class="label">Party ativa</div><div class="value">${num(s.party_slots)}</div></div><div class="metric"><div class="label">Tempo sessão</div><div class="value">${num(elapsed)} min</div></div></div><div class="rate-grid"><div class="rate"><span class="label">Level/hora</span><b>${num(rate)}</b></div><div class="rate"><span class="label">XP/hora</span><b>${esc(an.xp_per_hour??m.xp_h_display??'—')}</b></div><div class="rate"><span class="label">Loot/hora</span><b>${esc(an.loot_per_hour??m.loot_h_display??'—')}</b></div><div class="rate"><span class="label">Gold/hora</span><b>${num(a.goldPerHour??m.avg_gold_h??0)}</b></div><div class="rate"><span class="label">Kills/hora</span><b>${num(a.killsPerHour??m.avg_kills_h??0)}</b></div><div class="rate"><span class="label">Waves/hora</span><b>${num(m.avg_waves_h??0)}</b></div><div class="rate"><span class="label">Dano/s</span><b>${esc(Object.entries(damage).filter(([k])=>k!=='_raw').map(([k,v])=>k+': '+v).join(' · ')||'—')}</b></div><div class="rate"><span class="label">Recebido/s</span><b>${esc(Object.entries(taken).filter(([k])=>k!=='_raw').map(([k,v])=>k+': '+v).join(' · ')||'—')}</b></div></div><div class="split"><div><div class="section-title">Party</div>${party(s)}</div><div><div class="section-title">Decisão atual</div><p class="decision">${esc(d.reason||'Sem decisão registrada')}</p><div class="section-title">Subsistemas</div>${subs(s)}</div></div><details class="wide"><summary>Dados técnicos</summary><pre>${esc(JSON.stringify({loop_mode:s.loop_mode,treino:s.treino,magic:s.magic,analyzers:an,hunt_matrix:s.hunt_matrix},null,2))}</pre></details></article>`}
function bench(bots){const rows=[];for(const[id,b]of Object.entries(bots)){for(const[h,v]of Object.entries(b.benchmarks||{})){if(h.startsWith('_')||!v||typeof v!=='object')continue;rows.push(`<tr><td>${esc(id)}</td><td>${esc(v.name||h)}</td><td class="num">${num(v.gold_per_hour)}</td><td class="num">${num(v.kills_per_hour)}</td><td>${esc(v.deaths??0)}</td></tr>`)}}return`<table><thead><tr><th>Bot</th><th>Hunt</th><th>Gold/h</th><th>Kills/h</th><th>Deaths</th></tr></thead><tbody>${rows.length?rows.join(''):'<tr><td colspan="5">Sem benchmarks ainda</td></tr>'}</tbody></table>`}
function rates(data){const now=Date.now();for(const[id,b]of Object.entries(data.bots)){const l=Number(b.status?.level)||0,o=history[id];if(o&&l>0)b.status._levelRate=(l-o.level)/((now-o.time)/3600000);history[id]={level:l,time:now}}}
async function update(){try{const r=await fetch(API+'/api/overview',{cache:'no-store',headers:{'ngrok-skip-browser-warning':'true'}});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();rates(d);fleet.innerHTML=Object.entries(d.bots).map(([id,b])=>card(id,b)).join('');benchmarks.innerHTML=bench(d.bots);updated.textContent=new Date(d.generatedAt).toLocaleTimeString('pt-BR')}catch(e){updated.textContent='erro: '+e.message;fleet.innerHTML='<p class="error">Falha ao carregar: '+esc(e.message)+'</p>'}}
update();setInterval(update,5000);
</script></body></html>
