<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baiak Idle — Fleet Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            tibia: {
              dark: '#0f172a',
              card: '#1e293b',
              border: '#334155',
              gold: '#fbbf24',
              accent: '#38bdf8',
            }
          }
        }
      }
    }
  </script>
  <style>
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .pulse-online { animation: pulse-slow 2s infinite ease-in-out; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-sky-500 selection:text-white">

  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-lg bg-sky-500/20 border border-sky-500/40 flex items-center justify-center text-sky-400 font-bold text-lg shadow-sm">
          ⚔️
        </div>
        <div>
          <h1 class="font-bold text-base md:text-lg text-white leading-tight">Baiak Idle — Fleet Dashboard</h1>
          <p class="text-xs text-slate-400 hidden sm:block">Frota somente leitura</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <div id="statusBadge" class="flex items-center space-x-2 px-3 py-1 rounded-full text-xs font-medium bg-slate-800 border border-slate-700 text-slate-300">
          <span class="w-2 h-2 rounded-full bg-slate-400"></span>
          <span id="statusText">Carregando</span>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm">
        <div class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Contas Online</div>
        <div id="fleetOnline" class="text-lg md:text-xl font-bold text-emerald-400 mt-1">—</div>
        <div class="text-xs text-slate-400 mt-1">de <span id="fleetTotal">3</span> bots</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm">
        <div class="text-xs text-slate-400 uppercase tracking-wider font-semibold">XP / Hora (total)</div>
        <div id="fleetXp" class="text-lg md:text-xl font-bold text-cyan-400 mt-1">—</div>
        <div class="text-xs text-slate-400 mt-1">soma das contas</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm">
        <div class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Ouro / Hora</div>
        <div id="fleetLoot" class="text-lg md:text-xl font-bold text-amber-400 mt-1">—</div>
        <div class="text-xs text-slate-400 mt-1">loot estimado</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm">
        <div class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Ouro Total</div>
        <div id="fleetGold" class="text-lg md:text-xl font-bold text-amber-300 mt-1">—</div>
        <div class="text-xs text-slate-400 mt-1">nas contas</div>
      </div>
    </div>

    <div id="botGrid" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="p-6 text-center text-slate-500 bg-slate-900 border border-slate-800 rounded-xl col-span-full">Carregando telemetria…</div>
    </div>

  </main>

  <script>
    const FLEET_URL = 'https://visit-had-hamilton-cubic.trycloudflare.com/api/fleet';
    const REFRESH_MS = 15000;

    function fmt(n) {
      return Number(n || 0).toLocaleString('pt-BR');
    }

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function setBadge(state) {
      const badge = document.getElementById('statusBadge');
      const badgeText = document.getElementById('statusText');
      if (state === 'online') {
        badge.className = 'flex items-center space-x-2 px-3 py-1 rounded-full text-xs font-medium bg-emerald-950/60 border border-emerald-800/60 text-emerald-400';
        badgeText.textContent = 'Fleet online';
        return;
      }
      badge.className = 'flex items-center space-x-2 px-3 py-1 rounded-full text-xs font-medium bg-red-950/60 border border-red-800/60 text-red-400';
      badgeText.textContent = 'Offline';
    }

    function showOffline() {
      setBadge('offline');
      document.getElementById('botGrid').innerHTML =
        '<div class="p-6 text-center text-red-400 bg-slate-900 border border-slate-800 rounded-xl col-span-full">Telemetria offline.</div>';
    }

    async function fetchFleet() {
      try {
        const res = await fetch(FLEET_URL, { cache: 'no-store', method: 'GET' });
        if (!res.ok) throw new Error('offline');
        const data = await res.json();
        renderFleet(data);
        setBadge('online');
      } catch (err) {
        showOffline();
      }
    }

    function renderFleet(data) {
      const f = (data && data.fleet) || {};
      const online = Number(f.botsOnline || 0);
      const total = Number(f.botsTotal || 0);
      document.getElementById('fleetOnline').textContent = fmt(online);
      document.getElementById('fleetTotal').textContent = total ? fmt(total) : '0';
      document.getElementById('fleetXp').textContent = `${fmt(f.totalXpPerHour)} XP/h`;
      document.getElementById('fleetLoot').textContent = `${fmt(f.totalLootPerHour)} gold/h`;
      document.getElementById('fleetGold').textContent = fmt(f.totalGold);

      const bots = data && data.bots && typeof data.bots === 'object' ? data.bots : {};
      const keys = Object.keys(bots);
      const grid = document.getElementById('botGrid');
      if (!keys.length) {
        grid.innerHTML = '<div class="p-6 text-center text-slate-500 bg-slate-900 border border-slate-800 rounded-xl col-span-full">Nenhuma conta na telemetria.</div>';
        return;
      }
      grid.innerHTML = keys.map((key, idx) => botCard(bots[key], idx)).join('');
    }

    function parseStamina(stam) {
      if (!stam || stam === '-' || stam === '—' || stam === '0' || stam === 'null') {
        return { text: '—', pct: 0, color: 'text-slate-400', bg: 'bg-slate-700' };
      }
      let text = String(stam).trim();
      let pct = 0;
      const mPct = text.match(/(\d{1,3})%/);
      if (mPct) {
        pct = Math.min(100, Math.max(0, parseInt(mPct[1], 10)));
      } else {
        const mClock = text.match(/(\d{1,2}):(\d{2})/);
        if (mClock) {
          const h = parseInt(mClock[1], 10);
          const m = parseInt(mClock[2], 10);
          const mins = h * 60 + m;
          pct = Math.min(100, Math.max(0, Math.round((mins / 2520) * 100)));
          text = `${h}h ${String(m).padStart(2, '0')}m (${pct}%)`;
        }
      }
      let color = 'text-emerald-400';
      let bg = 'bg-emerald-500';
      if (pct < 50) {
        color = 'text-rose-400';
        bg = 'bg-rose-500';
      } else if (pct < 80) {
        color = 'text-amber-400';
        bg = 'bg-amber-500';
      }
      return { text, pct, color, bg };
    }

    function huntLabel(status, inTreino) {
      if (inTreino) return 'Treino Online';
      const hunt = status && status.hunt;
      const label = hunt && typeof hunt.name === 'string' ? hunt.name.trim() : '';
      return label || '—';
    }

    function partyRows(characters) {
      const list = Array.isArray(characters) ? characters : [];
      if (!list.length) {
        return '<div class="text-[11px] text-slate-500">sem dados</div>';
      }
      return list.map((c) => {
        const vocation = esc((c && c.vocation) || '—');
        const level = c && c.level != null && c.level !== '' ? esc(c.level) : '—';
        return `
          <div class="flex items-center justify-between text-[11px] bg-slate-800/50 border border-slate-700/50 rounded px-2 py-1">
            <span class="text-slate-200 truncate">${vocation}</span>
            <span class="text-sky-400 font-semibold whitespace-nowrap">Nv. ${level}</span>
          </div>`;
      }).join('');
    }

    function botCard(bot, index) {
      const s = (bot && bot.status) || {};
      const online = !!(bot && bot.online);
      const reachable = !!(bot && bot.reachable);
      const tel = s.telemetry || {};
      const rates = s.rates || {};
      const chars = Array.isArray(s.characters) ? s.characters : [];
      const level = tel.level == null || tel.level === '' ? '—' : fmt(tel.level);
      const inTreino = !!(s.state && s.state.inTreino);
      const xp = inTreino ? 0 : (rates.xpPerHour || 0);
      const kills = inTreino ? 0 : (rates.killsPerHour || 0);
      const stamInfo = parseStamina(tel.stamina);
      const hunt = esc(huntLabel(s, inTreino));
      const statusLabel = online ? 'online' : (reachable ? 'sala caiu' : 'offline');

      return `
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-sm space-y-4">
        <div class="flex items-start justify-between border-b border-slate-800 pb-3">
          <div>
            <div class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full ${online ? 'bg-emerald-500 pulse-online' : 'bg-red-500'}"></span>
              <h2 class="font-bold text-white text-base">Conta #${index + 1}</h2>
            </div>
            <div class="text-[11px] text-slate-400 mt-1">Lvl ${esc(level)} · ⚡ <span class="${stamInfo.color} font-medium">${esc(stamInfo.text)}</span></div>
          </div>
          <div class="flex flex-col items-end gap-1">
            <span class="text-[11px] px-2 py-0.5 rounded-full ${online ? 'bg-emerald-950/60 border border-emerald-800 text-emerald-400' : 'bg-red-950/60 border border-red-800 text-red-400'}">
              ${statusLabel}
            </span>
            ${inTreino ? '<span class="text-[10px] px-2 py-0.5 rounded-full bg-indigo-950/80 border border-indigo-700 text-indigo-300 font-semibold animate-pulse">🧘 Treino Online</span>' : ''}
          </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 text-xs">
          <div class="bg-slate-800/60 border border-slate-700/60 rounded-lg p-3">
            <div class="text-[10px] uppercase tracking-wider text-slate-400">Hunt</div>
            <div class="font-semibold text-sky-400 truncate">${hunt}</div>
          </div>
          <div class="bg-slate-800/60 border border-slate-700/60 rounded-lg p-3">
            <div class="flex items-center justify-between text-[10px] uppercase tracking-wider text-slate-400 mb-0.5">
              <span>⚡ Stamina</span>
              <span class="${stamInfo.color} font-bold">${stamInfo.pct}%</span>
            </div>
            <div class="font-semibold ${stamInfo.color} truncate">${esc(stamInfo.text)}</div>
            <div class="w-full bg-slate-900/80 rounded-full h-1.5 mt-2 overflow-hidden border border-slate-700/40">
              <div class="${stamInfo.bg} h-1.5 rounded-full transition-all duration-500" style="width: ${stamInfo.pct}%"></div>
            </div>
          </div>
          <div class="bg-slate-800/60 border border-slate-700/60 rounded-lg p-3">
            <div class="text-[10px] uppercase tracking-wider text-slate-400">XP / Hora</div>
            <div class="font-semibold text-cyan-400">${fmt(xp)}</div>
          </div>
          <div class="bg-slate-800/60 border border-slate-700/60 rounded-lg p-3">
            <div class="text-[10px] uppercase tracking-wider text-slate-400">Kills / Hora</div>
            <div class="font-semibold text-emerald-400">${fmt(kills)}</div>
          </div>
          <div class="bg-slate-800/60 border border-slate-700/60 rounded-lg p-3 col-span-2 sm:col-span-1">
            <div class="text-[10px] uppercase tracking-wider text-slate-400">Ouro</div>
            <div class="font-semibold text-amber-400">${fmt(tel.gold)}</div>
          </div>
        </div>

        <div class="border-t border-slate-800 pt-3 space-y-1">
          <div class="text-[10px] uppercase tracking-wider text-slate-400 mb-1">Party (${chars.length})</div>
          ${partyRows(chars)}
        </div>
      </div>`;
    }

    fetchFleet();
    setInterval(fetchFleet, REFRESH_MS);
  </script>
</body>
</html>
