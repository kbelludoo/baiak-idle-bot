name: ticket-relay

# ==============================================================================
# TICKET-RELAY WORKFLOW (AI-GO-BROWSER / PURE GO RELAYRUNNER)
# ==============================================================================
# Executa no GitHub Actions (2 vCPU / 7 GB RAM gratuitos).
# Lança Chromium real sob xvfb com Stealth JA4 + TicketRelayHook.
# Intercepta o turnstileToken em https://baiakidle.com e envia via tunnel.
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      push_url:
        description: "URL base do bot (ex: https://xxx.trycloudflare.com)"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: ticket-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: baiak-bot-go/go.sum

      - name: Compilar relayrunner
        working-directory: ./baiak-bot-go
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o ../relayrunner ./cmd/relayrunner

      - name: Localizar Chromium nativo
        id: chrome
        run: |
          for p in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$p" >/dev/null 2>&1; then
              echo "path=$(command -v "$p")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "nenhum Chromium encontrado no runner" >&2
          exit 1

      - name: Interceptar Turnstile Token via AI Go Browser (xvfb)
        run: |
          xvfb-run -a ./relayrunner \
            -browser-path "${{ steps.chrome.outputs.path }}" \
            -game "https://baiakidle.com/jogar" \
            -tunnel "${{ inputs.push_url }}" \
            -timeout 100s
