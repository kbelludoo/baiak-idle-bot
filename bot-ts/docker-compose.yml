services:
  baiak-bot-ts:
    build:
      context: ..
      dockerfile: bot-ts/Dockerfile
    container_name: baiak-bot-ts
    restart: always
    ipc: host
    shm_size: "256m"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - HEADLESS=true
      - LIVE_STREAM=true
      - USER_DATA_DIR=/app/data/chrome_profile
      - BAIAK_RUNTIME_DIR=/app/runtime
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
