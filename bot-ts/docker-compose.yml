services:
  baiak-bot-ts:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baiak-bot-ts
    restart: always
    ipc: host
    shm_size: "256m"
    user: "0:0"
    env_file:
      - path: .env
        required: false
    deploy:
      resources:
        limits:
          cpus: "0.80"
          memory: 512M
    environment:
      - PORT=${PORT:-8080}
      - HOST=0.0.0.0
      - HEADLESS=true
      - STREAM=false
      - CHROME_GL=off
      - ENABLE_KERNEL=false
      - GRAPHICS_THROTTLE=${GRAPHICS_THROTTLE:-false}
      - GRAPHICS_THROTTLE_MS=${GRAPHICS_THROTTLE_MS:-2000}
      - USER_DATA_DIR=/app/data/chrome_profile_ts
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./data-ts:/app/data
      - ./src:/app/src
